<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartStudy AI Tutor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>

    <h2>🤖 SmartStudy AI</h2>

    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="planner.html">Planner</a>
        <a href="quiz.html">Quiz</a>
        <a href="progress.html">Progress</a>
    </div>

</nav>


<div class="container">

    <div class="card chatbot">

        <h1>🤖 AI Study Tutor</h1>

        <p>
            Ask me anything. I can help with programming,
            mathematics, science, college subjects and more.
        </p>


        <div id="chatBox">

            <div class="bot-message">
                👋 Hi! I'm your SmartStudy AI Tutor.
                What would you like to learn today?
            </div>

        </div>


        <div class="chat-input">

            <input
                type="text"
                id="userMessage"
                placeholder="Ask anything..."
                onkeydown="handleEnter(event)"
            >

            <button onclick="sendMessage()">
                Send 🚀
            </button>

        </div>

    </div>

</div>


<script>

async function sendMessage() {

    const input = document.getElementById("userMessage");

    const message = input.value.trim();

    if (!message) {
        return;
    }


    const chatBox = document.getElementById("chatBox");


    // Show user message

    chatBox.innerHTML += `
        <div class="user-message">
            ${escapeHTML(message)}
        </div>
    `;


    input.value = "";


    // Show loading

    const loading = document.createElement("div");

    loading.className = "bot-message";

    loading.id = "loading";

    loading.textContent = "🤖 Thinking...";

    chatBox.appendChild(loading);


    chatBox.scrollTop = chatBox.scrollHeight;


    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: message
            })

        });


        const data = await response.json();


        document.getElementById("loading").remove();


        chatBox.innerHTML += `
            <div class="bot-message">
                🤖 ${formatAnswer(data.reply)}
            </div>
        `;


    } catch (error) {

        document.getElementById("loading").remove();

        chatBox.innerHTML += `
            <div class="bot-message">
                ❌ Cannot connect to the AI server.
                Make sure server.py is running.
            </div>
        `;

    }


    chatBox.scrollTop = chatBox.scrollHeight;
}


function handleEnter(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}


function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


function formatAnswer(text) {

    return escapeHTML(text)
        .replace(/\n/g, "<br>");

}

</script>

</body>

</html>
