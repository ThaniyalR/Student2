<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartStudy AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
    <div class="card welcome-card">

        <h1>🎓 SmartStudy AI</h1>
        <p class="subtitle">
            Your Personal AI-Powered Study Assistant
        </p>

        <label>Student Name</label>
        <input type="text" id="studentName" placeholder="Enter your name">

        <label>Daily Study Hours</label>
        <input type="number" id="studyHours" min="1" max="12"
               placeholder="Example: 3">

        <label>Subjects</label>
        <input type="text" id="subjects"
               placeholder="Example: Python, Java, DBMS">

        <button onclick="startStudy()">Start Learning 🚀</button>

    </div>
</div>

<script>
function startStudy() {

    const name = document.getElementById("studentName").value.trim();
    const hours = document.getElementById("studyHours").value;
    const subjects = document.getElementById("subjects").value.trim();

    if (!name || !hours || !subjects) {
        alert("Please fill all the fields.");
        return;
    }

    localStorage.setItem("studentName", name);
    localStorage.setItem("studyHours", hours);
    localStorage.setItem("subjects", subjects);

    localStorage.setItem("progress", "0");
    localStorage.setItem("quizScore", "0");

    window.location.href = "dashboard.html";
}
</script>

</body>
</html>
