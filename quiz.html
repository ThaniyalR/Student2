<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartStudy AI Quiz</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <h2>🤖 SmartStudy AI</h2>

    <div>
        <a href="dashboard.html">Dashboard</a>
        <a href="planner.html">Planner</a>
        <a href="chatbot.html">AI Tutor</a>
        <a href="progress.html">Progress</a>
    </div>
</nav>


<div class="container">

    <div class="card">

        <h1>🧠 AI Quiz</h1>

        <p id="quizInfo">
            Choose a subject and generate a new quiz.
        </p>

        <div class="quiz-settings">

            <select id="subject">
                <option value="Computer Science">Computer Science</option>
                <option value="Python">Python</option>
                <option value="Java">Java</option>
                <option value="C Programming">C Programming</option>
                <option value="DBMS">DBMS</option>
                <option value="HTML and CSS">HTML and CSS</option>
                <option value="SQL">SQL</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Mixed CSE">Mixed CSE</option>
            </select>

            <select id="difficulty">
                <option value="easy">Easy</option>
                <option value="medium" selected>Medium</option>
                <option value="hard">Hard</option>
            </select>

            <button onclick="generateQuiz()">
                🚀 Generate New Quiz
            </button>

        </div>


        <div id="loading" style="display:none;">
            <h3>🤖 AI is creating your quiz...</h3>
            <p>Please wait...</p>
        </div>


        <div id="quiz"></div>


        <div id="quizControls" style="display:none;">

            <button onclick="submitQuiz()">
                ✅ Submit Quiz
            </button>

            <button onclick="generateQuiz()">
                🔄 New Quiz
            </button>

        </div>


        <div id="result"></div>

    </div>

</div>


<script>

let questions = [];


/* =========================
   GENERATE QUIZ
========================= */

async function generateQuiz() {

    const subject =
        document.getElementById("subject").value;

    const difficulty =
        document.getElementById("difficulty").value;


    document.getElementById("loading").style.display = "block";

    document.getElementById("quiz").innerHTML = "";

    document.getElementById("quizControls").style.display = "none";

    document.getElementById("result").innerHTML = "";


    try {

        const response = await fetch("/generate-quiz", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                subject: subject,

                difficulty: difficulty,

                count: 10

            })

        });


        const data = await response.json();


        if (!response.ok) {

            throw new Error(data.error || "Quiz generation failed");

        }


        questions = data.questions;


        displayQuiz();


    } catch (error) {

        document.getElementById("quiz").innerHTML = `
            <div class="bot-message">
                ❌ ${escapeHTML(error.message)}
            </div>
        `;

    }


    document.getElementById("loading").style.display = "none";

}


/* =========================
   DISPLAY QUIZ
========================= */

function displayQuiz() {

    const quiz = document.getElementById("quiz");


    quiz.innerHTML = "";


    questions.forEach((q, index) => {

        const questionDiv =
            document.createElement("div");

        questionDiv.className = "quiz-question";


        let optionsHTML = "";


        q.options.forEach((option, optionIndex) => {

            optionsHTML += `
                <label class="quiz-option">

                    <input
                        type="radio"
                        name="question${index}"
                        value="${optionIndex}"
                    >

                    <span>
                        ${escapeHTML(option)}
                    </span>

                </label>
            `;

        });


        questionDiv.innerHTML = `

            <h3>
                ${index + 1}. ${escapeHTML(q.question)}
            </h3>

            ${optionsHTML}

        `;


        quiz.appendChild(questionDiv);

    });


    document.getElementById("quizControls")
        .style.display = "block";

}


/* =========================
   SUBMIT QUIZ
========================= */

function submitQuiz() {

    let score = 0;


    questions.forEach((q, index) => {

        const selected =
            document.querySelector(
                `input[name="question${index}"]:checked`
            );


        if (selected) {

            const answer =
                Number(selected.value);


            if (answer === q.answer) {

                score++;

            }

        }

    });


    const percentage =
        Math.round((score / questions.length) * 100);


    document.getElementById("result").innerHTML = `

        <div class="card">

            <h2>🎉 Quiz Completed!</h2>

            <h1>
                ${score} / ${questions.length}
            </h1>

            <p>
                Score: ${percentage}%
            </p>

            <button onclick="generateQuiz()">
                🔄 Generate Another Quiz
            </button>

        </div>

    `;


    // Save score

    localStorage.setItem(
        "quizScore",
        percentage
    );

}


/* =========================
   SECURITY
========================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}

</script>

</body>
</html>
