
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartStudy AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="landing">

    <div class="background-glow"></div>

    <main class="welcome-card">

        <div class="logo">🧠</div>

        <h1>SmartStudy <span>AI</span></h1>

        <p class="subtitle">
            Your intelligent personal study companion
        </p>

        <div class="form">

            <label>Student Name</label>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
            >

            <label>Daily Study Hours</label>

            <input
                type="number"
                id="studyHours"
                min="1"
                max="12"
                value="3"
            >

            <button onclick="startApp()">
                🚀 Start Learning
            </button>

        </div>

    </main>


    <!-- Loading screen -->

    <div id="loadingScreen" class="loading-screen">

        <div class="loader"></div>

        <h2>Preparing your AI study environment...</h2>

        <p id="loadingText">
            Analyzing your study preferences
        </p>

    </div>


<script>

function startApp() {

    const name =
        document.getElementById("studentName").value.trim();

    const hours =
        document.getElementById("studyHours").value;

    if(name === "") {

        alert("Please enter your name.");

        return;
    }

    localStorage.setItem("studentName", name);

    localStorage.setItem("studyHours", hours);


    document.getElementById("loadingScreen")
        .classList.add("show");


    const messages = [
        "Analyzing your study preferences...",
        "Preparing personalized learning tools...",
        "Creating your study environment...",
        "Initializing SmartStudy AI..."
    ];

    let i = 0;

    const interval = setInterval(() => {

        document.getElementById("loadingText")
            .innerText = messages[i];

        i++;

        if(i >= messages.length) {

            clearInterval(interval);

            setTimeout(() => {

                window.location.href =
                    "dashboard.html";

            }, 500);

        }

    }, 700);

}

</script>

</body>
</html>
